[project]
name = "gta6-clipper"
version = "0.1.0"
description = "Live GTA 6 Twitch clipper: chat-spike detection, retention edits, auto-post to YouTube/TikTok/Instagram"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2.6",
    "numpy>=1.26",
    "anthropic>=2.9",
    "faster-whisper>=1.1",
    "streamlink>=7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
